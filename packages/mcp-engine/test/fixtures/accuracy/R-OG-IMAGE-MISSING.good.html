<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>예시 상점 — 손으로 만든 도자기</title>
    <meta name="description" content="합성 예시 페이지입니다. 실제 사이트의 내용이 아닙니다." />
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:title" content="예시 상점 — 손으로 만든 도자기" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:description" content="합성 예시 페이지입니다." />
    <meta property="og:image" content="https://example.com/og/cover.png" />
  </head>
  <body>
    <main>
      <h1>예시 상점</h1>
      <p>정상 픽스처: og:image가 있으므로 R-OG-IMAGE-MISSING은 발화하지 않아야 한다.</p>
    </main>
  </body>
</html>
