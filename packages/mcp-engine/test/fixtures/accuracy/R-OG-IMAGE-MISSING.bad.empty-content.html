<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>빈 content 예시</title>
    <meta property="og:image" content="" />
    <meta name="og:image" content="https://example.com/wrong-attribute.png" />
  </head>
  <body>
    <h1>빈 content 예시</h1>
    <p>문제 픽스처: og:image 태그는 있지만 content가 비어 있고, 다른 태그는 property가 아닌 name 속성이라 인정되지 않는다.</p>
  </body>
</html>
