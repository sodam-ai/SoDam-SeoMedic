<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
</head><body><h1>예시 페이지</h1>
<svg width="20" height="20" role="img"><title>로고 아이콘</title><circle cx="10" cy="10" r="8"/></svg>
<p>알려진 미탐 후보: head에 title이 없고 본문 인라인 SVG의 title만 있다 — 문서의 첫 title 요소를 읽으면 SVG 것을 페이지 title로 오인할 수 있다.</p></body></html>
